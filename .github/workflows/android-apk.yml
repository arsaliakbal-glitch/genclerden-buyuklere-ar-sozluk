name: Android APK

# Sitedeki index.html değiştiğinde ya da elle başlatıldığında
# sözlüğün internetsiz çalışan Android uygulamasını (APK) üretir
# ve "Releases" sayfasına koyar.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android projesini oluştur
        run: |
          set -e
          A=android-app/app/src/main
          mkdir -p $A/java/com/arsaliakbal/sozluk $A/assets/www/lib/fonts $A/res/values

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Sozluk"
          include ':app'
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.arsaliakbal.sozluk'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.arsaliakbal.sozluk'
                  minSdk 24
                  targetSdk 34
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF

          cat > $A/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $A/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Gençlerden Büyüklere</string>
          </resources>
          EOF

          cat > $A/java/com/arsaliakbal/sozluk/MainActivity.java <<'EOF'
          package com.arsaliakbal.sozluk;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private static final String HOST = "appassets.androidplatform.net";
              private static final String START = "https://" + HOST + "/assets/www/index.html";
              private WebView web;
              private PermissionRequest pending;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  getWindow().setStatusBarColor(0xFF132B66);
                  web = new WebView(this);
                  setContentView(web);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest req) {
                          runOnUiThread(() -> {
                              boolean video = false;
                              for (String r : req.getResources())
                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)) video = true;
                              if (!video) { req.deny(); return; }
                              if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                  req.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                              } else {
                                  pending = req;
                                  requestPermissions(new String[]{Manifest.permission.CAMERA}, 1);
                              }
                          });
                      }
                  });

                  if (saved != null) web.restoreState(saved);
                  else web.loadUrl(START);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  if (pending == null) return;
                  if (results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED)
                      pending.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                  else pending.deny();
                  pending = null;
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              // Geri tuşu önce açık pencereyi (kamera, 3B defter, kelime listesi) kapatır.
              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  web.evaluateJavascript(
                      "(function(){" +
                      "if(typeof cam!=='undefined'&&cam.classList.contains('open')){closeCam();return true}" +
                      "if(typeof view3d!=='undefined'&&view3d.classList.contains('open')){closeBook3d();return true}" +
                      "var f=document.getElementById('fihrist');if(f&&f.classList.contains('open')){closeFihrist();return true}" +
                      "return false})()",
                      v -> { if (!"true".equals(v)) finish(); });
              }

              @Override protected void onPause() { super.onPause(); web.onPause(); }
              @Override protected void onResume() { super.onResume(); web.onResume(); }
              @Override protected void onDestroy() { web.destroy(); super.onDestroy(); }
          }
          EOF

      - name: Sözlük dosyalarını internetsiz çalışacak şekilde hazırla
        run: |
          set -e
          mkdir -p /tmp/deps && cd /tmp/deps
          npm init -y >/dev/null
          npm i --no-audit --no-fund three@0.159.0 @fontsource/atkinson-hyperlegible-next@5.3.0 >/dev/null
          pip install --quiet pillow
          cd "$GITHUB_WORKSPACE"
          python3 - <<'EOF'
          import re, shutil, os
          from PIL import Image, ImageDraw, ImageFont
          FS = '/tmp/deps/node_modules/@fontsource/atkinson-hyperlegible-next'
          A = 'android-app/app/src/main'
          W = A + '/assets/www'
          css = ''
          for f in ['400.css', '400-italic.css', '500.css', '700.css', '800.css']:
              c = open(f'{FS}/{f}').read()
              c = re.sub(r"url\(\./files/([^)]+?)\.woff2\) format\('woff2'\), url\(\./files/[^)]+?\.woff\) format\('woff'\)",
                         r"url(fonts/\1.woff2) format('woff2')", c)
              css += c + '\n'
          for fn in re.findall(r'fonts/([^)]+\.woff2)', css):
              shutil.copy(f'{FS}/files/{fn}', f'{W}/lib/fonts/{fn}')
          open(f'{W}/lib/fonts.css', 'w').write(css)
          shutil.copy('/tmp/deps/node_modules/three/build/three.min.js', f'{W}/lib/three.min.js')
          shutil.copy(f'{FS}/LICENSE', f'{W}/lib/LISANS-yazi-tipi-OFL.txt')
          shutil.copy('/tmp/deps/node_modules/three/LICENSE', f'{W}/lib/LISANS-three.js-MIT.txt')

          s = open('index.html', encoding='utf-8', newline='').read()
          s = re.sub(r'<link rel="preconnect"[^>]*>\r?\n', '', s)
          s, n = re.subn(r'<link href="https://fonts\.googleapis\.com/[^"]*" rel="stylesheet">', '<link href="lib/fonts.css" rel="stylesheet">', s)
          assert n == 1, 'yazı tipi bağlantısı bulunamadı'
          s, n = re.subn(r"const urls=\[[^\]]*\]", "const urls=['lib/three.min.js']", s)
          assert n == 1, 'three.js adresi bulunamadı'
          open(f'{W}/index.html', 'w', encoding='utf-8', newline='').write(s)

          # Uygulama simgesi
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          S = 512
          im = Image.new('RGBA', (S, S), (0, 0, 0, 0)); d = ImageDraw.Draw(im)
          d.rounded_rectangle([60, 30, 452, 482], radius=28, fill=(29, 63, 143, 255))
          d.rectangle([60, 30, 100, 482], fill=(19, 43, 102, 255))
          d.rounded_rectangle([150, 150, 410, 300], radius=18, fill=(255, 255, 255, 255))
          try:
              font = ImageFont.truetype('DejaVuSans-Bold.ttf', 64)
          except OSError:
              font = ImageFont.load_default()
          d.text((280, 225), 'GB', fill=(29, 63, 143, 255), font=font, anchor='mm')
          d.rectangle([150, 330, 410, 338], fill=(224, 74, 79, 255))
          for k, px in sizes.items():
              os.makedirs(f'{A}/res/mipmap-{k}', exist_ok=True)
              im.resize((px, px), Image.LANCZOS).save(f'{A}/res/mipmap-{k}/ic_launcher.png')
          print('hazır')
          EOF

      - name: APK'yı derle
        run: gradle -p android-app assembleDebug --no-daemon --stacktrace

      - name: APK'yı yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Genclerden-Buyuklere-Sozlugu.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Genclerden-Buyuklere-Sozlugu.apk \
            --title "Android uygulaması" \
            --notes "Telefonda bu sayfadan Genclerden-Buyuklere-Sozlugu.apk dosyasına dokunup indirin, sonra açıp yükleyin. Telefon 'bilinmeyen uygulamalar' izni isterse bu kaynağa izin verin. İnternet gerekmez."

      - uses: actions/upload-artifact@v4
        with:
          name: Genclerden-Buyuklere-Sozlugu-apk
          path: Genclerden-Buyuklere-Sozlugu.apk
